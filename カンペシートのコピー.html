<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タイトル</title>
 
</head>

<style type="text/css">

body{
    text-align: center;　センターに揃える
    font-family: ヒラギノ明朝 ProN W3;　フォントを変える
    color: #cacfd4;　フォントの色
    margin: 0;
    box-sizing: border-box;　画像のサイズにマージンを含まない（サイズ調節がしやすくなる）

    }

#background {
  background-image: url("写真のurlを貼り付ける");
  background-attachment: fixed;　背景がスクロールされない
  background-size: cover;
  background-position: center;
}

#name{
    position: fixed; 常に同じ場所に配置
    width: 100%;
    padding: 10px;
    border: 0;
    margin: 0;
    top: 0;
    background-color: #595b83;
    color: #cacfd4;
}

</style>

<body>
<div id = "background">

<div id = "name"> 文章 </div>

<h1>見出し1</h1>
<h2>見出し2</h2>
<h3>見出し3</h3>
<h4>見出し4</h4>
<h5>見出し5</h5>
<h6>見出し6</h6>

<p>段落</p>

<ul>
    <li>順序なしリスト</li>
    <li>順序なしリスト</li>
    <li>順序なしリスト</li>
</ul>
    
<ol>
    <li>順序ありリスト</li>
    <li>順序ありリスト</li>
    <li>順序ありリスト</li>
</ol>

<br>改行
<hr>区切り線

<a href="リンクのURLを貼り付ける">リンク先の名前</a>

<img src="画像のリンクを貼り付ける">
    


</div>

</body>
</html>
